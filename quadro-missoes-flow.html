<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quadro de Missões · Ander Flow</title><link rel="stylesheet" href="./frontend/paginas/missoes/quadro.css"></head>
<body><header><a href="./central-equipe-flow.html">← Equipe e Conversas</a><strong>Quadro de Missões</strong><span>Ander Flow</span></header>
<main><section class="apresentacao"><div><p class="etiqueta">CENTRAL DE MISSÕES · MODO LOCAL</p><h1>Seu trabalho em movimento</h1><p>Organize tarefas reais da equipe. Cada mudança é salva neste navegador, sem simular uma execução de IA.</p></div><div class="resumo" id="resumo" aria-live="polite"></div></section>
<section class="ferramentas" aria-label="Ferramentas do quadro"><label>Buscar missão<input id="busca" type="search" placeholder="Nome, descrição ou responsável"></label><label>Responsável<select id="filtro-agente"></select></label><button id="nova">+ Nova missão</button><button id="exportar" class="secundario">Exportar JSON</button></section>
<div class="quadro" id="quadro" aria-label="Etapas das missões"><section class="coluna" data-etapa="pendente"><h2>Planejadas <span id="n-pendente">0</span></h2><div class="pilha" id="pendente"></div></section><section class="coluna" data-etapa="andamento"><h2>Em andamento <span id="n-andamento">0</span></h2><div class="pilha" id="andamento"></div></section><section class="coluna" data-etapa="concluida"><h2>Concluídas <span id="n-concluida">0</span></h2><div class="pilha" id="concluida"></div></section></div>
<section class="atividade"><h2>Últimas movimentações</h2><div id="atividade" aria-live="polite"></div></section></main>
<dialog id="editor"><form id="form-missao"><h2 id="titulo-editor">Nova missão</h2><label>Título<input id="titulo" required maxlength="100"></label><label>Descrição<textarea id="descricao" maxlength="600" rows="3"></textarea></label><div class="campos"><label>Responsável<select id="agente"></select></label><label>Prioridade<select id="prioridade"><option value="normal">Normal</option><option value="alta">Alta</option><option value="urgente">Urgente</option></select></label></div><div class="campos"><label>Prazo<input id="prazo" type="date"></label><label>Etapa<select id="etapa"><option value="pendente">Planejada</option><option value="andamento">Em andamento</option><option value="concluida">Concluída</option></select></label></div><div class="acoes"><button type="button" id="cancelar" class="secundario">Cancelar</button><button type="submit">Salvar missão</button></div></form></dialog>
<script src="./frontend/paginas/missoes/quadro.js" defer></script></body></html>
