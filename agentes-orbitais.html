<!--
=====================================================================
AGENTES ORBITAIS v8 — Ander Quant OS  (arquivo único, sem dependências)
=====================================================================
PARA OUTRAS IAs (como reutilizar / implantar em qualquer site):

1) COPIAR TUDO: HTML + CSS + JS inline, Canvas 2D, sem bibliotecas.
   Única chamada externa: Google Fonts (opcional; há fontes de reserva).
2) EMBUTIR:
   a) Página inteira: publique o arquivo como está.
   b) <iframe src="agentes-orbitais.html" style="width:100%;aspect-ratio:16/10;border:0"></iframe>
   c) Inline: copie <style>, <div id="ao-root"> e o <script> para a página.
3) TEMAS (abas no topo, agrupadas; mesmo arquivo, mesma lógica):
   GRUPO GAME (principal):
     pixel      — arcade 8-bit: sprites, moeda→troféu, placar e CRT
     dados      — RPG de mesa: dados d4…d20 rolando sobre feltro e mapa hex
     naves      — space shooter: naves com motores e estação espacial que cresce
     cartas     — card game: cartas que viram, holográficas, carta lendária
     voxel      — mundo de blocos: blocos com rostinho, ilha 3D e farol em pirâmide
   GRUPO ESTILOS:
     criaturas  — mascotes fofos (o núcleo choca de um ovo)
     cosmos     — planetas reais iluminados pela estrela-núcleo
     cyber      — terminal neon: drones wireframe e núcleo de IA
     bio        — microscópio: micro-organismos e uma célula que evolui
     arcano     — espíritos elementais e um orbe mágico com runas
   GRUPO NATUREZA:
     oceano     — fundo do mar: bichos marinhos, concha que vira pérola e coral
     floresta   — bosque: insetos e plantinhas, semente que vira árvore anciã
     clima      — previsão do tempo: gota → nuvem → tempestade → furacão → sol com arco-íris
     deserto    — dunas: oásis que cresce até pirâmide, cactos e lagartos
     artico     — polo: floco → bola de neve → iglu → castelo de gelo, aurora boreal
   GRUPO POP:
     comida     — lanchonete: comidinhas com rosto, bolo que ganha andares
     musica     — show: instrumentos, nota → vinil → toca-discos → boombox → palco
     esportes   — estádio: bolas de vários esportes, medalhas → troféu
     origami    — papel dobrado: figuras de origami em tema claro
     brinquedos — quarto de brinquedos: castelo de blocos e fogos
   CONFIG.tema = tema inicial · CONFIG.grupos = grupos de abas, ordem e temas visíveis.
   URL com #naves (ou outro id) abre direto no tema.
4) CRIAR TEMA NOVO: TEMAS.meutema = { id, nome, cor, css, pal, niveis,
   fundoEstatico(g,w,h,s), fundo(t,dt), chao(t), agente(a,t,u,info),
   nucleo(nv,t,u,est), auraNucleo(cx,cy,r,nv,t,est), escudo(...), tiro(s,t),
   frente(t,dt) }. Tudo é opcional menos agente e nucleo (há padrões).
   Desenho de agente/núcleo usa coordenadas unitárias (raio 1, centro 0,0).
5) CONFIG: agentes (ativo:true na órbita, false na reserva), órbitas 3D
   (r, incl, no, vel), XP, eventos, cadeia de passes, ameaças.
6) LÓGICA: núcleo começa no nível 1 e evolui com o tempo e com os sinais.
   Tiros em todas as direções (sinal, passe, ordem, mercado, fill).
   Ameaças: núcleo levanta barreira, agentes reforçam, interceptores
   abatem. Depois de lucro / combo / evolução existe "zona segura".
7) API: AgentesOrbitais.tema('cosmos') · .pulso('EDGE') · .passe('SPOTTER','PRIOR')
   .ordem('TAKER') · .mercado('TAKER') · .ataque('HACK') · .darXP(25)
   .setNivel(3) · .ativar('SACI') · .desativar('SACI') · .setStatus('KELLY','sizing 2%')
8) ACESSIBILIDADE: abas com teclado (setas), respeita prefers-reduced-motion.
=====================================================================
-->
